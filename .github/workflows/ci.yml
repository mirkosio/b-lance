name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - name: Test JavaScript (logica del riepilogo Cassiere)
        run: node --test tests/js/*.test.mjs
      - name: Flutter analyze
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: cd app-android && flutter pub get
      - run: cd app-android && flutter analyze
      - run: cd app-android && flutter test
