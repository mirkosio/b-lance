<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="blTitle">
  <title id="blTitle">b-lance</title>
  <!-- Marchio "split b": l'asta è intera, la pancia è divisa in due archi uguali.
       Il vuoto diagonale è la divisione della spesa; i due archi restano in equilibrio. -->
  <g fill="none" stroke-linecap="butt">
    <path d="M19 12.5V51.5" stroke="#242B27" stroke-width="8" stroke-linecap="round"/>
    <circle cx="35" cy="36" r="13" stroke="#5F8D6E" stroke-width="7"
            stroke-dasharray="36.6 4.24" transform="rotate(45 35 36)"/>
  </g>
</svg>
