{% extends "base.html" %}
{% block title %}Accedi — b-lance{% endblock %}
{% block content %}
<div class="card" style="max-width:430px;margin:26px auto">
  <div style="text-align:center;margin-bottom:8px">
    <span class="mark" style="display:inline-grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--primary-deep);box-shadow:0 3px 10px rgba(71,104,79,.3)">
      <img src="/static/logo-mark-inverse.svg?v=2" alt="">
    </span>
  </div>
  <h1 class="section-title" style="justify-content:center">Accedi</h1>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next|default('') }}">
    <label for="login-email">Email</label>
    <input type="email" id="login-email" name="email" required autofocus autocomplete="email" placeholder="tu@email.com">
    <label for="login-password">Password</label>
    <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="La tua password">
    <div style="margin-top:18px">
      <button class="btn block" type="submit">
        <svg width="17" height="17"><use href="#i-login"></use></svg> Entra
      </button>
    </div>
  </form>
  <p class="muted small" style="margin-top:16px;text-align:center">
    Non hai un account? <a href="/register?next={{ next|default('')|urlencode }}">Registrati</a>
  </p>
</div>
{% endblock %}
