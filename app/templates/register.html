{% extends "base.html" %}
{% block title %}Registrati — b-lance{% endblock %}
{% block content %}
<div class="card" style="max-width:430px;margin:26px auto">
  <div style="text-align:center;margin-bottom:8px">
    <span class="mark" style="display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--primary-deep);box-shadow:0 3px 10px rgba(71,104,79,.3)">
      <img src="/static/logo-mark-inverse.svg" alt="">
    </span>
  </div>
  <h1 class="section-title" style="justify-content:center">Crea account</h1>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/register">
    <input type="hidden" name="next" value="{{ next|default('') }}">
    <label for="register-name">Nome</label>
    <input type="text" id="register-name" name="name" required autofocus autocomplete="name" placeholder="Come ti chiami?">
    <label for="register-email">Email</label>
    <input type="email" id="register-email" name="email" required autocomplete="email" placeholder="tu@email.com">
    <label for="register-password">Password</label>
    <input type="password" id="register-password" name="password" required minlength="6" autocomplete="new-password" placeholder="Almeno 6 caratteri">
    <div style="margin-top:18px">
      <button class="btn block" type="submit">
        <svg width="17" height="17"><use href="#i-bolt"></use></svg> Crea account
      </button>
    </div>
  </form>
  <p class="muted small" style="margin-top:16px;text-align:center">
    Hai già un account? <a href="/login?next={{ next|default('')|urlencode }}">Accedi</a>
  </p>
</div>
{% endblock %}
