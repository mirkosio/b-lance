{% extends "base.html" %}
{% block title %}Nuova password — b-lance{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin:26px auto">
  <h1 class="section-title" style="justify-content:center">Nuova password</h1>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/reset-password" data-inline-validation novalidate>
    <input type="hidden" name="token" value="{{ token|default('') }}">
    <label for="reset-password">Nuova password</label>
    <input type="password" id="reset-password" name="password" required minlength="6"
           autocomplete="new-password" placeholder="Almeno 6 caratteri">
    <div style="margin-top:18px">
      <button class="btn block" type="submit">Salva la password</button>
    </div>
  </form>
  <p class="muted small" style="margin-top:16px">
    Dopo il cambiamento tutte le sessioni aperte verranno chiuse.
  </p>
</div>
{% endblock %}
