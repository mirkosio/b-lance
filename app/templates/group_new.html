{% extends "base.html" %}
{% block title %}Nuovo gruppo — b-lance{% endblock %}
{% block content %}
<div class="pagehead">
  <h1>Nuovo gruppo</h1>
  <p>Un gruppo per ogni vacanza, casa o cena.</p>
</div>

<div class="card" style="max-width:470px">
  <form method="post" action="/groups/new">
    <label for="group-name">Nome</label>
    <input type="text" id="group-name" name="name" required autofocus placeholder="Es. Weekend a Rimini">

    <label for="group-kind">Tipo</label>
    <select id="group-kind" name="kind">
      <option value="other">Altro</option>
      <option value="trip">Viaggio</option>
      <option value="home">Casa / roommate</option>
      <option value="event">Evento</option>
    </select>

    <label for="group-currency">Valuta del gruppo</label>
    <select id="group-currency" name="base_currency">
      {% for c in currencies %}
        <option value="{{ c.code }}" {% if c.code == 'EUR' %}selected{% endif %}>
          {{ c.code }} — {{ c.name }}
        </option>
      {% endfor %}
    </select>
    <p class="muted small" style="margin:6px 0 0">
      I saldi di tutto il gruppo restano in questa valuta.
    </p>

    <div style="margin-top:20px">
      <button class="btn block" type="submit">
        <svg width="17" height="17"><use href="#i-plus"></use></svg> Crea gruppo
      </button>
    </div>
  </form>
</div>
{% endblock %}
