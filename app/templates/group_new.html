{% extends "base.html" %}
{% block title %}Nuovo gruppo — B-Lance{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin:30px auto">
  <div class="section-title">Nuovo gruppo</div>
  <form method="post" action="/groups/new">
    <label>Nome</label>
    <input type="text" name="name" required autofocus placeholder="Es. Weekend a Rimini">
    <label>Tipo</label>
    <select name="kind">
      <option value="other">Altro</option>
      <option value="trip">Viaggio</option>
      <option value="home">Casa / roommate</option>
      <option value="event">Evento</option>
    </select>
    <label>Valuta del gruppo</label>
    <select name="base_currency">
      {% for c in currencies %}
        <option value="{{ c.code }}" {% if c.code == 'EUR' %}selected{% endif %}>
          {{ c.code }} — {{ c.name }}
        </option>
      {% endfor %}
    </select>
    <div style="margin-top:20px">
      <button class="btn block" type="submit">Crea gruppo</button>
    </div>
  </form>
</div>
{% endblock %}
