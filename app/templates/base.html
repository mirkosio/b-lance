<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SiamoQuiti{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <nav class="nav">
    <a href="/" class="brand">Siamo<span>Quiti</span></a>
    <div class="right">
      {% if user %}
        <a href="/groups/new" class="btn sm">Nuovo gruppo</a>
        <form method="post" action="/logout" style="margin:0">
          <button class="btn sm ghost" type="submit">Esci</button>
        </form>
      {% else %}
        <a href="/login" class="btn sm ghost">Accedi</a>
        <a href="/register" class="btn sm">Registrati</a>
      {% endif %}
    </div>
  </nav>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer>SiamoQuiti — dividiamo, regoliamo, siamo quiti.</footer>
</body>
</html>
